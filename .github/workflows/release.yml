name: Build precompiled NIFs

# Builds the NIF and the worker for Typsty.Pool for every target when a version is tagged
# (such as 0.1.0), and attaches them to the tag's GitHub release, where RustlerPrecompiled
# downloads them from. Each target's tarball has both, so that RustlerPrecompiled, which
# extracts the whole tarball, puts the worker next to the NIF. See RELEASING.md for the
# whole release process.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        # Typsty.Native only uses NIF 2.15 features, which work on every OTP version since 22
        nif: ["2.15"]
        job:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-pc-windows-gnu, os: windows-2022 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract the project version
        shell: bash
        run: echo "PROJECT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "${PROJECT_VERSION}" ]; then
            echo "The tag ${GITHUB_REF_NAME} doesn't match the VERSION file (${PROJECT_VERSION})"
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install cross
        if: ${{ matrix.job.use-cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build the NIF and the worker
        id: build
        shell: bash
        run: |
          tarball=$(.github/scripts/build-native.sh "${{ matrix.job.target }}" "${{ matrix.nif }}" "$PROJECT_VERSION" "${{ matrix.job.use-cross || false }}" | tail -n 1)
          echo "file-path=$tarball" >> "$GITHUB_OUTPUT"
          echo "file-name=$(basename "$tarball")" >> "$GITHUB_OUTPUT"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}

      - name: Publish the build to the GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.build.outputs.file-path }}
