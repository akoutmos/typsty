[package]
name = "typsty_nif"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "typsty_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
comemo = "0.5"
rustler = { version = "0.38", default-features = false, features = ["derive"] }
typst = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"
typstyle-core = "0.15.3"
time = "0.3"

[profile.release]
# Smaller and faster NIFs, at the cost of longer release builds
lto = true
codegen-units = 1

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]
